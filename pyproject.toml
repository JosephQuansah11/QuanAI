[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanai"
version = "0.1.0"
description = "A self-checking, multimodal AI agent that builds apps, decks, images and videos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-pptx>=0.6.21",
    "pillow>=9.0",
    "numpy>=1.23",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
asr = ["faster-whisper>=1.0"]
vision = ["opencv-python-headless>=4.8"]

[project.scripts]
quanai = "quanai.cli:main"

[tool.setuptools.packages.find]
include = ["quanai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
